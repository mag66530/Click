# Базовая тема Streamlit подогнана под палитру Click (ui_theme.py, словарь LIGHT).
# Здесь только то, что Streamlit рисует ДО нашего CSS – чтобы при загрузке не
# мигало чужим цветом.
#
# Светлая, а не тёмная: тёмная вставала автоматом при каждом заходе, а работают
# с Click днём. Переключатель в шапке остаётся, выбор держится в сессии.
# Менять этот файл нужно ВМЕСТЕ с умолчанием в streamlit_app.theme() – иначе
# страница мигнёт одним цветом и перекрасится в другой.
[theme]
base = "light"
primaryColor = "#5b7cfa"
backgroundColor = "#f7f8fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#141824"
font = "sans serif"

[server]
maxUploadSize = 25
